<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Mi resumen del día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-filtro="todo">
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="barra">
  <div class="barra-in">
    <div class="marca">
      <h1>Mi resumen <em>del día</em></h1>
      <p id="fecha" class="fecha"></p>
    </div>
    <div class="derecha">
      <nav id="filtros" class="filtros" aria-label="Filtros"></nav>
      <button type="button" id="tema-btn" class="tema-btn"></button>
    </div>
  </div>
</header>
<div id="aviso" class="aviso" hidden>Datos de ejemplo — reemplazá el contenido de <code>noticias.js</code> con tus noticias.</div>
<main id="contenido">
  <section id="esencial" class="esencial" hidden aria-labelledby="esencial-rot"></section>
  <p id="vacio" class="vacio" hidden>Hoy no pasó nada que valga la pena contar.</p>
  <div id="temas" class="temas"></div>
  <section id="hilos" class="hilos" hidden aria-labelledby="hilos-rot"></section>
</main>
<footer class="pie">Curado por Grok · se actualiza todos los días a las 07:00</footer>
<div id="pop" class="pop" role="tooltip" hidden></div>
<script src="noticias.js"></script>
<script src="hilos.js"></script>
<script src="glosario.js"></script>
<script src="app.js"></script>
</body>
</html>
